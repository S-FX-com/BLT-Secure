# Pull-request and branch CI. Before this existed, the only workflow was release.yml, which
# ships every push to main after `php -l blt-secure.php` alone.
#
# The plugin promises PHP 7.4+, so the suite runs on the whole supported range. The
# token-level 7.4 gate (tests/test-php74-compat.php) fails the build on 8.0+ syntax.
#
# Third-party actions are pinned to major tags here (read-only token, no secrets);
# tasks/specs/01-ci-and-release-integrity.md pins them to commit SHAs together with the
# release workflow, which does hold write permission.

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, openssl, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: composer lint

      - name: Unit tests
        run: composer test

      # WPCS is style and WordPress-API hygiene, not version-specific: run it once.
      - name: PHPCS (WordPress-Extra)
        if: matrix.php == '8.2'
        run: composer phpcs

  dashboard:
    name: Legacy dashboard Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests
        working-directory: dashboard
        run: node --test
