# BLT Secure fleet dashboard — Cloudflare Worker config.
# LEGACY — superseded by Buoy / BLT Connect. See DEPLOY.md for the runbook.

name = "blt-secure-fleet"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Do NOT expose the Worker on the default <name>.<subdomain>.workers.dev host:
# Cloudflare Access protects the custom hostname only, and every other
# hostname that reaches the Worker is reachable without it. Serve the Worker
# from a custom domain / route only.
workers_dev = false

# Operator routes (/ and /admin/*) verify the Cloudflare Access JWT and FAIL
# CLOSED while either value below is empty.
#   ACCESS_TEAM_DOMAIN  your Zero Trust team domain, e.g. "acme.cloudflareaccess.com"
#   ACCESS_AUD          the Application Audience (AUD) tag of the Access app
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# Fill database_id in after `wrangler d1 create blt-secure-fleet`.
[[d1_databases]]
binding = "DB"
database_name = "blt-secure-fleet"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
